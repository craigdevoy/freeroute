[package]
name = "freeroute"
version = "0.1.0"
edition = "2021"
description = "Small MCP bridge that sends bulk text work to free OpenRouter models"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
